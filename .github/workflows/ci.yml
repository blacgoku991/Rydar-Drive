name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  checks:
    name: Typecheck · tests unitaires · builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (shared, web, worker, app chauffeur)
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Build worker
        run: pnpm --filter @rydar/worker build
      - name: Build web
        run: pnpm --filter @rydar/web build
        env:
          # Valeurs factices : aucune page n'appelle Supabase au build.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_ROOT_DOMAIN: rydar.localhost

  database:
    name: PostgreSQL — RLS, dispatch, concurrence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Dépendances (racine uniquement)
        run: pnpm install --frozen-lockfile --filter rydar-drive
      - name: Tests base de données (stubs Supabase + migrations sur base vierge)
        run: pnpm test:db
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      - name: Migrations + seed de démonstration sur une base neuve
        env:
          DB_NAME: rydar_demo
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          bash scripts/db-local.sh --reset --seed
          test "$(psql -d rydar_demo -tAc 'select count(*) from public.drivers')" = "29"
          test "$(psql -d rydar_demo -tAc 'select count(*) from public.organizations')" = "3"
          # Centrale de démonstration (option 2) : un banni signalé, des commissions à encaisser
          test "$(psql -d rydar_demo -tAc 'select count(*) from public.fraud_reports where status = $$open$$')" = "1"
          test "$(psql -d rydar_demo -tAc 'select count(*) > 0 from public.ride_settlements where status = $$due$$')" = "t"

  worker-image:
    name: Image Docker du worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -f apps/worker/Dockerfile -t rydar-worker:ci .
      - name: Base (stubs + migrations)
        run: DB_NAME=rydar bash scripts/db-local.sh --reset
      - name: Démarrage + healthcheck
        run: |
          docker run -d --name worker --network host \
            -e DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/rydar \
            -e PUSH_DRY_RUN=true rydar-worker:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q '"healthy":true'; then docker logs worker; exit 0; fi
            sleep 1
          done
          docker logs worker
          exit 1

  web-image:
    name: Image Docker du site + kit VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image (Next.js standalone)
        run: |
          docker build -f apps/web/Dockerfile -t rydar-web:ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-anon-key \
            --build-arg NEXT_PUBLIC_APP_URL=https://rydar.example \
            --build-arg NEXT_PUBLIC_ROOT_DOMAIN=rydar.example .
      - name: Démarrage + healthcheck
        run: |
          docker run -d --name web -p 3000:3000 -e SUPABASE_SERVICE_ROLE_KEY=ci -e API_KEY_PEPPER=ci rydar-web:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health | grep -q '"ok":true'; then
              curl -fsS -o /dev/null -w "login %{http_code}\n" http://127.0.0.1:3000/login
              # Carte (variables NEXT_PUBLIC_MAP_* vides, comme en production) : CSP, worker, adresse des tuiles
              curl -fsS -D - -o /dev/null http://127.0.0.1:3000/login | grep -i '^content-security-policy' | grep -q 'tiles.openfreemap.org' \
                || { echo "✗ CSP sans serveur de tuiles : carte bloquée"; exit 1; }
              curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/maplibre/maplibre-gl-worker.mjs \
                || { echo "✗ worker MapLibre absent de l'image"; exit 1; }
              docker exec web sh -c "grep -rqs 'tiles.openfreemap.org/planet' /app/apps/web/.next/static" \
                || { echo "✗ adresse des tuiles absente du code navigateur"; exit 1; }
              docker logs web
              exit 0
            fi
            sleep 1
          done
          docker logs web
          exit 1
      - name: Docker Compose et Caddy (deploy/)
        run: |
          cp deploy/.env.example deploy/.env
          sed -i -e 's|^DOMAIN=.*|DOMAIN=rydar.example|' -e 's|^ACME_EMAIL=.*|ACME_EMAIL=ci@rydar.example|' \
            -e 's|^NEXT_PUBLIC_SUPABASE_URL=.*|NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co|' \
            -e 's|^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*|NEXT_PUBLIC_SUPABASE_ANON_KEY=ci|' \
            -e 's|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=ci|' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci|' \
            -e 's|^API_KEY_PEPPER=.*|API_KEY_PEPPER=ci|' deploy/.env
          docker compose -f deploy/docker-compose.yml config -q
          docker run --rm -e DOMAIN=rydar.example -e ACME_EMAIL=ci@rydar.example \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for f in deploy/*.sh; do bash -n "$f"; done
