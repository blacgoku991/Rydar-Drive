# Rydar Drive sur un VPS : site (Next.js), worker (dispatch + notifications), expéditeur d'e-mails (formulaire de
# contact, via le serveur mail du VPS), Redis, Caddy (HTTPS automatique). La base de données, l'authentification,
# le temps réel et le stockage des documents sont chez Supabase (projet cloud, région Europe) : le VPS ne garde
# aucune donnée métier.
#   sudo bash deploy/install.sh        (installation, migrations, construction, démarrage)
#   cd deploy && docker compose logs -f web worker mailer
name: rydar

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web:
    <<: *service
    image: rydar-web
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # Intégrées au build (navigateur + CSP) : reconstruire l'image si elles changent
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
        NEXT_PUBLIC_APP_URL: https://${DOMAIN:?}
        NEXT_PUBLIC_ROOT_DOMAIN: ${DOMAIN:?}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_TILES_URL: ${NEXT_PUBLIC_MAP_TILES_URL:-}
        NEXT_PUBLIC_MAP_GLYPHS_URL: ${NEXT_PUBLIC_MAP_GLYPHS_URL:-}
        NEXT_PUBLIC_MAP_CONNECT_ORIGINS: ${NEXT_PUBLIC_MAP_CONNECT_ORIGINS:-}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_ROOT_DOMAIN: ${DOMAIN}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?}
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-geopf}
      GEOCODER_URL: ${GEOCODER_URL:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Budget quotidien des fournisseurs payants (Google, Mapbox) : vide = 20000 (docs/DEPLOYMENT.md § 2)
      GEO_DAILY_BUDGET: ${GEO_DAILY_BUDGET:-}
      DRIVER_APP_ORIGINS: ${DRIVER_APP_ORIGINS:-}
      APPLE_APP_IDS: ${APPLE_APP_IDS:-}
      IOS_APP_URL: ${IOS_APP_URL:-}
      ANDROID_APP_URL: ${ANDROID_APP_URL:-}
      ANDROID_APP_PACKAGE: ${ANDROID_APP_PACKAGE:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      # Destinataire des demandes du formulaire de contact ; vide = e-mail de /admin/legal, puis LEGAL_EMAIL.
      # Le site n'envoie rien lui-même : il met les e-mails en file (public.email_outbox), le service mailer les envoie
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
    depends_on:
      - redis

  worker:
    <<: *service
    image: rydar-worker
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      # Certificat du serveur de la base vérifié avec la racine publique Supabase (deploy/supabase-ca.crt, monté
      # ci-dessous). Repli (ancien mode, chiffré SANS vérification) : DATABASE_SSLMODE=no-verify dans deploy/.env
      # (docs/DEPLOYMENT.md, « Connexion chiffrée à la base »)
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-verify-full}
      DATABASE_CA_FILE: /etc/rydar/supabase-ca.crt
      # API Supabase avec la clé service role (Storage, administration d'Auth) : reprise des suppressions de compte
      # chauffeur (dossier des justificatifs, compte de connexion). Sans elles, la file n'est jamais reprise.
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
      ACCOUNT_DELETIONS_MS: ${ACCOUNT_DELETIONS_MS:-}
      # Webhooks sortants des centrales : lien « self » des courses envoyées (même URL publique que l'API v1)
      APP_URL: https://${DOMAIN:?}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      # Recommandé en production, avec « Enhanced Security for Push Notifications » chez Expo (docs/DEPLOYMENT.md § 3)
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      FCM_SERVICE_ACCOUNT_B64: ${FCM_SERVICE_ACCOUNT_B64:-}
      APNS_KEY_P8_B64: ${APNS_KEY_P8_B64:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_PRODUCTION: ${APNS_PRODUCTION:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
      FLIGHT_PROVIDER: ${FLIGHT_PROVIDER:-}
      AERODATABOX_KEY: ${AERODATABOX_KEY:-}
      AERODATABOX_MARKETPLACE: ${AERODATABOX_MARKETPLACE:-}
      AERODATABOX_URL: ${AERODATABOX_URL:-}
      AVIATIONSTACK_KEY: ${AVIATIONSTACK_KEY:-}
      AVIATIONSTACK_URL: ${AVIATIONSTACK_URL:-}
      AVIATIONSTACK_TIMES: ${AVIATIONSTACK_TIMES:-}
      FLIGHTAWARE_KEY: ${FLIGHTAWARE_KEY:-}
      FLIGHTAWARE_URL: ${FLIGHTAWARE_URL:-}
    volumes:
      - ./supabase-ca.crt:/etc/rydar/supabase-ca.crt:ro

  # Expéditeur d'e-mails du formulaire de contact (notification au super admin, accusé de réception, réponses,
  # e-mail de test) : lit la file public.email_outbox et envoie en SMTP. Même image que le worker (construite par
  # le service worker, jamais téléchargée), autre commande.
  # Réseau de l'hôte : « 127.0.0.1:25 » y désigne le serveur mail du VPS lui-même (Postfix, écoute locale
  # seulement), qui relaie sans identifiant ce qui vient de la machine. Aucun port publié ; le point de santé
  # n'écoute que sur 127.0.0.1 (MAILER_HEALTH_PORT, 8081). docs/DEPLOYMENT.md, « E-mails : formulaire de contact ».
  mailer:
    <<: *service
    image: rydar-worker
    pull_policy: never
    command: ["node", "dist/mailer.js"]
    network_mode: host
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?}
      # Même chiffrement vérifié que le worker (deploy/supabase-ca.crt, monté ci-dessous)
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-verify-full}
      DATABASE_CA_FILE: /etc/rydar/supabase-ca.crt
      # Expéditeur par défaut : Rydar Drive <noreply@DOMAIN> ; MAIL_FROM : « adresse » ou « Nom <adresse> »
      DOMAIN: ${DOMAIN:?}
      MAIL_FROM: ${MAIL_FROM:-}
      # Serveur mail du VPS par défaut ; relais externe (avancé) : SMTP_HOST, SMTP_PORT (587 ou 465), SMTP_USER,
      # SMTP_PASS dans deploy/.env (valeur entre apostrophes si elle contient un $)
      SMTP_HOST: ${SMTP_HOST:-127.0.0.1}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAILER_HEALTH_PORT: ${MAILER_HEALTH_PORT:-8081}
      # Port lu par le HEALTHCHECK de l'image (apps/worker/Dockerfile) : le même
      HEALTH_PORT: ${MAILER_HEALTH_PORT:-8081}
    volumes:
      - ./supabase-ca.crt:/etc/rydar/supabase-ca.crt:ro

  redis:
    <<: *service
    image: redis:7-alpine
    # Compteurs d'anti brute force / limites de débit : rien à sauvegarder
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  caddy:
    <<: *service
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Itinéraires auto-hébergés (optionnel) : bash deploy/osrm-prepare.sh, puis OSRM_URL=http://osrm:5000
  # et docker compose --profile osrm up -d
  osrm:
    <<: *service
    image: ghcr.io/project-osrm/osrm-backend:latest
    profiles: ["osrm"]
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/region.osrm"]
    volumes:
      - ./osrm:/data:ro

volumes:
  caddy_data:
  caddy_config:
