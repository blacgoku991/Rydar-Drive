# Configuration Supabase CLI (supabase start / db push / db reset).
# Les valeurs de production se règlent aussi dans le dashboard Supabase.
project_id = "rydar-drive"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/set-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Aucune inscription publique : les rattacheurs sont créés par le Super Admin,
# les chauffeurs par leur rattacheur (invitation ou mot de passe).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
